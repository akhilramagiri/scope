<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive MVP Scope Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chosen Palette: Calm Neutrals (Warm Beige, Slate, Off-white) -->
    <!-- Application Structure Plan: The application uses a dashboard structure. A persistent sidebar (or top-bar on mobile) provides navigation/filtering based on the 9 main scope categories. A main content area displays a summary chart (items per category) and a detailed, filterable list of all scope items. This structure was chosen to allow users to easily switch between a high-level overview (the chart) and a detailed, focused view (the filtered list), which is much more usable for project management and stakeholder discussions than a static document. -->
    <!-- Visualization & Content Choices: 
        - Report Info: 9 categories of scope items. Goal: Organize/Inform. Viz/Presentation: Interactive filter buttons (HTML/JS) and a horizontal bar chart (Chart.js/Canvas). Interaction: Clicking a filter button or chart bar filters the main list. Justification: Provides both a tactile (button) and visual (chart) way to navigate the scope.
        - Report Info: Individual scope items (e.g., "1.1 Generate..."). Goal: Inform. Viz/Presentation: Styled "cards" in a scrollable list (HTML/Tailwind/JS). Interaction: List is dynamically updated by filters. Justification: "Card" layout clearly separates each item, improving readability over a dense text list.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            height: 400px;
            max-height: 450px;
        }
        @media (max-width: 768px) {
            .chart-container {
                height: 300px;
                max-height: 350px;
            }
        }

        .nav-button {
            transition: all 0.3s ease;
        }
        .nav-button.active {
            background-color: #475569;
            color: #ffffff;
            font-weight: 600;
        }
        .nav-button:hover:not(.active) {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="app" class="flex flex-col md:flex-row min-h-screen">
        
        <!-- Sidebar Navigation -->
        <nav class="w-full md:w-64 lg:w-72 bg-white shadow-lg p-4 md:p-6 shrink-0">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Scope Categories</h2>
            <div id="nav-filters" class="flex flex-row md:flex-col overflow-x-auto md:overflow-x-visible pb-2 md:pb-0">
                <button class="nav-button active text-left w-full shrink-0 md:w-full px-4 py-2.5 rounded-lg text-sm font-medium text-slate-700" data-filter="all">
                    Show All
                </button>
                <!-- Nav buttons will be injected by JS -->
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:p-8 lg:p-10 overflow-auto">
            
            <!-- Header -->
            <header class="mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">Interactive MVP Scope Dashboard</h1>
                <p class="text-lg text-slate-600">An interactive view of the Consolidated MVP Scope List.</p>
            </header>

            <!-- Overview Chart -->
            <section id="overview" class="mb-8 p-6 bg-white rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold text-slate-900 mb-4">Scope Distribution by Category</h2>
                <p class="text-slate-600 mb-6">This chart shows the number of sub-tasks for each of the 9 main scope categories. Click on a bar to filter the list below.</p>
                <div class="chart-container">
                    <canvas id="scopeChart"></canvas>
                </div>
            </section>

            <!-- Scope Item List -->
            <section id="scope-list">
                <h2 id="list-title" class="text-2xl font-semibold text-slate-900 mb-6">All Scope Items</h2>
                <div id="item-container" class="grid grid-cols-1 gap-4">
                    <!-- Scope items will be injected by JS -->
                </div>
            </section>

        </main>
    </div>

    <script>
        const scopeData = [
            {
                category: "Loan Numbering & Primary IDs",
                items: [
                    { id: "1.1", text: "Generate Unique Loan Number: Implement a \"foolproof algorithm\" (e.g., 'SOL-MMYY-NNNN') to generate a new, unique loan number upon loan approval." },
                    { id: "1.2", text: "Loan Number as Primary Identifier: Use the new loan number (not the Quote ID) as the primary identifier for all banking users and end-customers post-approval." },
                    { id: "1.3", text: "De-emphasize Quote ID: The Quote ID's lifecycle must end at approval. It should not be visible to customers or used in operational comms (can be kept for internal DB reference)." },
                    { id: "1.4", text: "Customer ID as Primary Key: The Customer ID must be the ultimate unique primary key, capable of mapping to multiple, separate loan accounts (e.g., one customer with a solar loan and an EV loan)." }
                ]
            },
            {
                category: "Banking Roles & Permissions",
                items: [
                    { id: "2.1", text: "Define Specific Banking Roles: Identify, define, and implement a hierarchy of specific banking roles (e.g., \"Payment Operations,\" \"Compliance\") instead of a generic \"Admin\"." },
                    { id: "2.2", text: "Restrict Operational \"Admin\": The \"Admin\" term should not be used for users performing daily banking operations like loan disbursement." },
                    { id: "2.3", text: "IT Support Admin Role: The \"Admin\" role should be reserved for the IT/Production Support team for data fixes and technical maintenance." }
                ]
            },
            {
                category: "Reconciliation, Ledgers, and Reporting",
                items: [
                    { id: "3.1", text: "Dedicated Reconciliation Screen: Build a new \"dedicated reconciliation screen\" for the banking/operations portal." },
                    { id: "3.2", text: "Recon Screen Filtering: The screen must allow filtering by date range (daily, weekly, monthly), by customer, and by loan type." },
                    { id: "3.3", text: "Ledger Comparison: The screen must display ledgers from Zepto and SOLVI (Pams) to allow for simple reconciliation (matching payments to customers/loans)." },
                    { id: "3.4", text: "Support for Manual \"Real\" Reconciliation: The screen must provide the data necessary for a business user to manually cross-check the daily bank account statement (real money) against the SOLVI ledger." },
                    { id: "3.5", text: "Downloadable Ledger Reports: Create a function to \"download that Ledger for a day\" as a CSV/reconciled file for operations and auditing." },
                    { id: "3.6", text: "Failed Payment Reporting: Implement a report or filter to pull all failed payments and their corresponding successful retries." }
                ]
            },
            {
                category: "Disbursement and Repayment Logic",
                items: [
                    { id: "4.1", text: "SaaS-style Feature Configuration: Build system features (like partial disbursement) to be flexible and configurable (enabled/disabled) based on the partner's (e.g., OSW) requirements." },
                    { id: "4.2", text: "Support Partial & Multi-Party Payments: The system must support partial payments (e.g., upfront installer payment) and multi-party disbursements (e.g., to installer, distributor)." },
                    { id: "4.3", text: "Manual Configuration (for MVP): These settings (partial/multi-party) can be manually configured for the initial release." },
                    { id: "4.4", text: "Repayment Failure - Customer Notification: On a failed repayment, the system must immediately trigger a reminder notification to the customer." },
                    { id: "4.5", text: "Repayment Failure - Retry Process: The system must have a defined process for rerunning the failed payment (a manual retry option is acceptable for MVP)." }
                ]
            },
            {
                category: "Installation Status Notification & Disbursement Trigger",
                items: [
                    { id: "5.1", text: "Customer Portal (CEDE): Implement a \"Confirm Installation\" button or status update feature within the customer's loan dashboard, which updates the loan status to \"Customer Confirmed Installation.\"" },
                    { id: "5.2", text: "Installer Process (External): Define process for installer to email \"Installation Complete\" confirmation and all supporting documents to the operations team." },
                    { id: "5.3", text: "Operations Portal (Admin/Banking Portal): Create a section on the individual loan management page to manage \"Post-Installation Documents.\"" },
                    { id: "5.4", text: "Operations Portal (Admin/Banking Portal): Provide a feature for the Ops team to upload and save the installer's supporting documents directly against that loan." },
                    { id: "5.5", text: "Operations Portal (Admin/Banking Portal): Add a manual \"Verify Documents\" checkbox or button for the Ops team to confirm they have received and approved all required documents from the installer." },
                    { id: "5.6", text: "Disbursement Logic (System Trigger): The system must check for two conditions before triggering disbursement: 1. Loan status includes \"Customer Confirmed Installation\" (from Portal), and 2. Loan status includes \"Installer Documents Verified\" (from Ops Portal). Ideally, when both are true, the loan moves to \"Ready for Disbursement\"." }
                ]
            },
            {
                category: "Admin Portal",
                items: [
                    { id: "6.1", text: "Document & Agreement Management: \"Template repository, Signature Logs, Document Generation\"" },
                    { id: "6.2", text: "Reporting & Analytics: \"Operational Reports, Financial Reports\" (*Note: This overlaps with Reconciliation/Reporting*)" },
                    { id: "6.3", text: "Payment Page: Disbursement Orchestration - Multi-Party Disbursements (*Note: This overlaps with Disbursement Logic*)" }
                ]
            },
            {
                category: "Credit Decisioning",
                items: [
                    { id: "7.1", text: "IDV Via GBG: Id verification" },
                    { id: "7.2", text: "Banking data via Experian: Credit profile verification through Experian" },
                    { id: "7.3", text: "Expense / Income Inputs - APRA: Expense and income inputs obtained as per APRA compliance" },
                    { id: "7.4", text: "Bankstatements Integration: Integration required between SOLVI and Bankstatements" }
                ]
            },
            {
                category: "Repayment Schedules",
                items: [
                    { id: "8.1", text: "Notification and logging: SMS / Emails to be sent pre-due date" },
                    { id: "8.2", text: "Trigger process: \"Triggering process to be enabled on Due date [late payment fees, etc]\"" },
                    { id: "8.3", text: "Exception handling: \"Retry logic + bounce charge triggers, delinquency handling\" (*Note: This overlaps with Repayment Logic*)" },
                    { id: "8.4", text: "NOC release" },
                    { id: "8.5", text: "Post-Closure compliance" }
                ]
            },
            {
                category: "Post-Loan Customer Management",
                items: [
                    { id: "9.1", text: "NOC downloads: Download the NOC documents through portal" },
                    { id: "9.2", text: "Address / Bank updates: Update the bank / address details if in case of any change" },
                    { id: "9.3", text: "Statement requests: Update the requests for the statements" },
                    { id: "9.4", text: "Rate adjustments: Auto-recalculated adjustments" },
                    { id: "9.5", text: "Moratorium Handling: Support for crisis [Support types]" },
                    { id: "9.6", text: "Top-Up loan servicing: Option to support more secondary loans" },
                    { id: "9.7", text: "Delinquency Workflow: DPD flags + NPA tagging after 90 days & integration with collections engine" }
                ]
            }
        ];

        let myChart;
        let currentFilter = 'all';
        const navContainer = document.getElementById('nav-filters');
        const itemContainer = document.getElementById('item-container');
        const listTitle = document.getElementById('list-title');

        document.addEventListener('DOMContentLoaded', () => {
            populateNav();
            populateList();
            createChart();
            setupNavListeners();
        });

        function populateNav() {
            scopeData.forEach(group => {
                const button = document.createElement('button');
                button.className = 'nav-button text-left w-full shrink-0 md:w-full px-4 py-2.5 rounded-lg text-sm font-medium text-slate-700';
                button.dataset.filter = group.category;
                button.textContent = group.category;
                navContainer.appendChild(button);
            });
        }

        function populateList() {
            itemContainer.innerHTML = '';
            let itemsToShow = [];

            if (currentFilter === 'all') {
                itemsToShow = scopeData.flatMap(group => group.items);
                listTitle.textContent = 'All Scope Items';
            } else {
                const group = scopeData.find(g => g.category === currentFilter);
                itemsToShow = group ? group.items : [];
                listTitle.textContent = `Scope Items: ${currentFilter}`;
            }

            if (itemsToShow.length === 0) {
                itemContainer.innerHTML = '<p class="text-slate-500">No items found for this category.</p>';
                return;
            }

            itemsToShow.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-lg shadow-sm border border-slate-200';
                
                const parts = item.text.split(':');
                const title = parts[0];
                const description = parts.slice(1).join(':').trim();

                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <span class="flex-shrink-0 inline-flex items-center justify-center h-6 w-6 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold">${item.id}</span>
                        <div class="flex-1">
                            <h3 class="text-base font-semibold text-slate-800">${title}</h3>
                            <p class="text-sm text-slate-600 mt-1">${description}</p>
                        </div>
                    </div>
                `;
                itemContainer.appendChild(card);
            });
        }

        function createChart() {
            const ctx = document.getElementById('scopeChart').getContext('2d');
            
            const labels = scopeData.map(group => {
                const words = group.category.split(' ');
                if (words.length > 3) {
                    return [words.slice(0, 3).join(' '), words.slice(3).join(' ')];
                }
                return group.category;
            });
            const data = scopeData.map(group => group.items.length);

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '# of Scope Items',
                        data: data,
                        backgroundColor: 'rgba(71, 85, 105, 0.7)',
                        borderColor: 'rgba(71, 85, 105, 1)',
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            beginAtZero: true,
                            grid: {
                                drawOnChartArea: false,
                            },
                        },
                        y: {
                            grid: {
                                display: false,
                            },
                            ticks: {
                                autoSkip: false,
                                font: {
                                    size: 11,
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: {
                                size: 14,
                                weight: 'bold'
                            },
                            bodyFont: {
                                size: 12
                            },
                            displayColors: false,
                            callbacks: {
                                title: (tooltipItems) => {
                                    const label = tooltipItems[0].label;
                                    return Array.isArray(label) ? label.join(' ') : label;
                                }
                            }
                        }
                    },
                    onClick: (e) => {
                        const activePoints = myChart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
                        if (activePoints.length) {
                            const index = activePoints[0].index;
                            const category = scopeData[index].category;
                            setFilter(category);
                        }
                    }
                }
            });
        }

        function setupNavListeners() {
            navContainer.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    const filter = e.target.dataset.filter;
                    setFilter(filter);
                }
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('#nav-filters .nav-button').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const categoryIndex = scopeData.findIndex(g => g.category === filter);
            myChart.data.datasets[0].backgroundColor = scopeData.map((g, i) => 
                (i === categoryIndex || filter === 'all') ? 'rgba(71, 85, 105, 0.7)' : 'rgba(203, 213, 225, 0.7)'
            );
            myChart.data.datasets[0].borderColor = scopeData.map((g, i) => 
                (i === categoryIndex || filter === 'all') ? 'rgba(71, 85, 105, 1)' : 'rgba(203, 213, 225, 1)'
            );
            myChart.update();

            populateList();
        }

    </script>
</body>
</html>
